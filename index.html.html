<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم المحاسبة - الترم الأول</title>
    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444;
            --text-color: #f8fafc;
            --sub-text: #94a3b8;
            --primary: #2563eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        /* شاشة تسجيل الدخول */
        #login-screen {
            max-width: 400px;
            margin: 80px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; margin-bottom: 5px; color: var(--sub-text); }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .scary-logo { display: flex; align-items: center; gap: 12px; }
        .skull-icon { font-size: 32px; filter: drop-shadow(0 0 8px var(--accent-color)); }
        .logo-text { font-size: 22px; font-weight: 900; color: var(--accent-color); }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .subject-title {
            font-size: 18px;
            color: #38bdf8;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .folder-list { list-style: none; padding: 0; }
        .folder-item {
            padding: 10px;
            margin: 8px 0;
            background: #0f172a;
            border-radius: 6px;
            font-size: 14px;
        }

        .admin-panel {
            background: #1e1b4b;
            border: 1px solid #6366f1;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: none;
        }

        .file-upload-box { display: flex; gap: 10px; flex-wrap: wrap; }
        .file-upload-box select, .file-upload-box input {
            padding: 8px;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            border-radius: 5px;
        }

        .hidden { display: none !important; }
        .file-link { color: #38bdf8; text-decoration: underline; display: block; margin-top: 4px; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. شاشة الدخول -->
    <div id="login-screen">
        <h2 style="color: var(--accent-color);">بوابة الدخول 🔒</h2>
        <div class="input-group">
            <label>اسم المستخدم:</label>
            <input type="text" id="username" placeholder="ادخل اسم المستخدم">
        </div>
        <div class="input-group">
            <label>كلمة السر:</label>
            <input type="password" id="password" placeholder="ادخل كلمة السر">
        </div>
        <button onclick="login()">دخول المنصة</button>
        <p id="error-msg" style="color: var(--accent-color); font-size: 13px; margin-top: 10px;"></p>
    </div>

    <!-- 2. محتوى المنصة -->
    <div id="main-platform" class="hidden">
        <header>
            <div class="scary-logo">
                <span class="skull-icon">💀📊</span>
                <div>
                    <div class="logo-text">DEBT & DEATH</div>
                    <div style="font-size: 11px; color: var(--sub-text);">قسم محاسبة - الترم الأول</div>
                </div>
            </div>
            <div>
                <span id="user-badge" style="background: #334155; padding: 5px 12px; border-radius: 15px; font-size: 13px;"></span>
                <button onclick="logout()" style="width: auto; padding: 5px 10px; margin-right: 10px; background: #dc2626;">خروج</button>
            </div>
        </header>

        <!-- لوحة رفع الملفات (تظهر لمحمود فقط) -->
        <div id="admin-controls" class="admin-panel">
            <h3>⚙️ لوحة رفع الملفات والصور أونلاين</h3>
            <div class="file-upload-box">
                <select id="select-subject">
                    <option value="1">الاقتصاد الدولي</option>
                    <option value="2">اداره التمويل والاستثمار</option>
                    <option value="3">اصول المراجعه</option>
                    <option value="4">محاسبه التكاليف</option>
                    <option value="5">أساليب التنبؤ الاحصائي 1</option>
                    <option value="6">الرقابه والمراجعة الداخلية</option>
                </select>

                <select id="select-category">
                    <option value="محاضرات">محاضرات</option>
                    <option value="سكاشن">سكاشن</option>
                    <option value="كويزات">كويزات</option>
                    <option value="كتاب الماده">كتاب الماده</option>
                    <option value="حاجات مهمه للماده">حاجات مهمه للماده</option>
                </select>

                <input type="file" id="file-input">
                <button id="upload-btn" onclick="uploadFile()" style="width: auto; background: #16a34a;">رفع للمنصة 📤</button>
            </div>
        </div>

        <!-- شبكة المواد -->
        <div class="subjects-grid" id="subjects-container"></div>
    </div>

</div>

<script>
    // تم إدراج البيانات الخاصة بك هنا
    const SUPABASE_URL = 'https://shiiachtncgstchfzcsu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NS8B1nLDZYIW90p7lKgcfg_LfRbnDCP';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const USERS = {
        "Amr2007": { pass: "9999", role: "user", name: "عمرو" },
        "Menna2006": { pass: "8888", role: "user", name: "منة" },
        "MAHMOUD2006": { pass: "Mahmoud2006", role: "admin", name: "محمود (المتحكم)" }
    };

    const SUBJECTS = [
        { id: "1", name: "الاقتصاد الدولي" },
        { id: "2", name: "اداره التمويل والاستثمار" },
        { id: "3", name: "اصول المراجعه" },
        { id: "4", name: "محاسبه التكاليف" },
        { id: "5", name: "أساليب التنبؤ الاحصائي 1" },
        { id: "6", name: "الرقابه والمراجعة الداخلية" }
    ];

    const CATEGORIES = ["محاضرات", "سكاشن", "كويزات", "كتاب الماده", "حاجات مهمه للماده"];

    function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const error = document.getElementById('error-msg');

        if (USERS[u] && USERS[u].pass === p) {
            error.innerText = "";
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-platform').classList.remove('hidden');
            
            document.getElementById('user-badge').innerText = "المستخدم: " + USERS[u].name;

            if (USERS[u].role === "admin") {
                document.getElementById('admin-controls').style.display = "block";
            } else {
                document.getElementById('admin-controls').style.display = "none";
            }

            loadFilesAndRender();
        } else {
            error.innerText = "اسم المستخدم أو كلمة السر غير صحيحة!";
        }
    }

    function logout() {
        document.getElementById('main-platform').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    // رفع الملف مباشرة إلى Supabase Storage
    async function uploadFile() {
        const subjectId = document.getElementById('select-subject').value;
        const category = document.getElementById('select-category').value;
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');

        if (fileInput.files.length === 0) {
            alert("يرجى اختيار صورة أو ملف أولاً!");
            return;
        }

        const file = fileInput.files[0];
        const filePath = `${subjectId}/${category}/${Date.now()}_${file.name}`;

        uploadBtn.innerText = "جاري الرفع...";
        uploadBtn.disabled = true;

        const { data, error } = await supabaseClient
            .storage
            .from('accounting-files')
            .upload(filePath, file);

        uploadBtn.innerText = "رفع للمنصة 📤";
        uploadBtn.disabled = false;

        if (error) {
            alert("حدث خطأ أثناء الرفع: " + error.message);
        } else {
            alert("تم رفع الملف بنجاح وظهر أونلاين!");
            fileInput.value = "";
            loadFilesAndRender();
        }
    }

    // جلب قائمة الملفات من Supabase وعرضها
    async function loadFilesAndRender() {
        const container = document.getElementById('subjects-container');
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>جاري تحميل البيانات والملفات...</p>";

        let html = "";

        for (let sub of SUBJECTS) {
            html += `<div class="subject-card">
                <h3 class="subject-title">${sub.id}. ${sub.name}</h3>
                <ul class="folder-list">`;

            for (let cat of CATEGORIES) {
                const { data: files } = await supabaseClient
                    .storage
                    .from('accounting-files')
                    .list(`${sub.id}/${cat}`);

                const count = files ? files.length : 0;

                html += `<li class="folder-item">
                    <div style="display:flex; justify-content:space-between;">
                        <span>📂 ${cat}</span>
                        <span><b>${count}</b> ملفات</span>
                    </div>`;

                if (files && files.length > 0) {
                    files.forEach(f => {
                        const { data: publicUrlData } = supabaseClient
                            .storage
                            .from('accounting-files')
                            .getPublicUrl(`${sub.id}/${cat}/${f.name}`);

                        html += `<a class="file-link" href="${publicUrlData.publicUrl}" target="_blank">📄 ${f.name}</a>`;
                    });
                }

                html += `</li>`;
            }

            html += `</ul></div>`;
        }

        container.innerHTML = html;
    }
</script>

</body>
</html>
